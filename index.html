<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cinéfolio</title><style>body{font-family:system-ui;background:#101827;color:#f4f6fa;max-width:1100px;margin:auto;padding:24px}input,button{padding:12px;border-radius:8px;border:0}input{width:65%}button{cursor:pointer;background:#21b7a8;color:#081522;margin:4px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:18px}.card{background:#202d40;border-radius:12px;padding:12px}.card img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:8px}small{color:#bac6d6}h1{color:#4ce0cd}</style></head><body><h1>🎬 Cinéfolio</h1><p>Suivez vos séries et vos films, chez vous.</p><input id="q" placeholder="Rechercher une série ou un film"><button onclick="search()">Rechercher</button><h2>Ma bibliothèque</h2><div id="library" class="grid"></div><h2>Résultats</h2><div id="results" class="grid"></div><section id="details"></section><script>
const api=async(url,opts)=>{const r=await fetch(url,opts);if(!r.ok)throw Error(await r.text());return r.json()};
const poster=p=>p?'https://image.tmdb.org/t/p/w342'+p:'';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const card=x=>'<div class="card">'+(x.poster_path||x.poster?'<img src="'+poster(x.poster_path||x.poster)+'">':'')+'<h3>'+esc(x.title||x.name)+'</h3><small>'+esc(x.media_type||x.kind)+'</small><p><button onclick="add(\''+(x.media_type||x.kind)+'\','+x.id+')">Ajouter</button></p></div>';
let hits=[];
async function search(){try{hits=(await api('/api/search?q='+encodeURIComponent(document.querySelector('#q').value))).filter(x=>['tv','movie'].includes(x.media_type));document.querySelector('#results').innerHTML=hits.map((x,i)=>'<div class="card">'+(x.poster_path?'<img src="'+poster(x.poster_path)+'">':'')+'<h3>'+esc(x.title||x.name)+'</h3><button onclick="addHit('+i+')">Ajouter</button></div>').join('')}catch(e){alert(e.message)}}
async function addHit(i){const x=hits[i];await api('/api/library',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:x.media_type,tmdb_id:x.id,title:x.title||x.name,poster:x.poster_path})});load()}
async function load(){try{const a=await api('/api/library');document.querySelector('#library').innerHTML=a.map(x=>'<div class="card">'+(x.poster?'<img src="'+poster(x.poster)+'">':'')+'<h3>'+esc(x.title)+'</h3><button onclick="removeItem(\''+x.kind+'\','+x.tmdb_id+')">Retirer</button>'+(x.kind==='movie'?'<button onclick="toggleMovie('+x.tmdb_id+')">'+(x.watched?'Vu ✓':'Marquer vu')+'</button>':'<button onclick="showTv('+x.tmdb_id+')">Épisodes</button>')+'</div>').join('')}catch(e){alert(e.message)}}
async function removeItem(kind,id){await api('/api/library/'+kind+'/'+id,{method:'DELETE'});load()}
async function toggleMovie(id){await api('/api/movie/'+id+'/watched',{method:'POST'});load()}
async function showTv(id){try{const tv=await api('/api/tv/'+id);const s=document.querySelector('#details');s.innerHTML='<h2>'+esc(tv.name)+'</h2>'+tv.seasons.filter(x=>x.season_number>0).map(x=>'<button onclick="showSeason('+id+','+x.season_number+')">Saison '+x.season_number+'</button>').join('')+'<div id="episodes"></div>';window.watched=new Set(tv.watched_episodes.map(x=>x.season+':'+x.episode))}catch(e){alert(e.message)}}
async function showSeason(id,n){const s=await api('/api/tv/'+id+'/season/'+n);document.querySelector('#episodes').innerHTML=s.episodes.map(e=>'<p><label><input type="checkbox" '+(window.watched.has(n+':'+e.episode_number)?'checked':'')+' onchange="episode('+id+','+n+','+e.episode_number+',this.checked)"> '+esc(e.name)+'</label></p>').join('')}
async function episode(tmdb_id,season,episode,watched){await api('/api/episode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tmdb_id,season,episode,watched})})}
load();</script></body></html>
