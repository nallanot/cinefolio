<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0e11"><title>Cinéfolio — Mes séries et films</title>
<style>
:root{color-scheme:dark;--bg:#0b0e11;--panel:#171b20;--card:#20252b;--line:#30363c;--text:#f5f6f7;--muted:#a0a7af;--yellow:#ffcb05;--green:#20c997}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}.sidebar{border-right:1px solid var(--line);padding:26px 15px;position:sticky;top:0;height:100vh}.brand{font-size:23px;font-weight:900;letter-spacing:-.9px;display:flex;align-items:center;gap:10px;margin:0 10px 36px}.brand span{color:var(--yellow)}.nav{display:flex;flex-direction:column;gap:6px}.nav button{width:100%;border:0;background:transparent;color:#c4c8cc;text-align:left;padding:13px 15px;border-radius:10px;font-weight:650}.nav button.active,.nav button:hover{background:var(--yellow);color:#101010}.sidebar small{display:block;color:var(--muted);margin:30px 14px 12px}.main{min-width:0}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:17px 25px;background:#0b0e11ed;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.top input{background:#1d2227;border:1px solid #343b42;color:white;border-radius:12px;padding:13px 16px;flex:1;max-width:500px;outline:none}.top input:focus{border-color:var(--yellow)}.primary{background:var(--yellow);color:#121212;border:0;padding:11px 15px;border-radius:9px;font-weight:800}.ghost{background:#2a3036;color:white;border:0;padding:10px 13px;border-radius:9px}.wrap{padding:26px;max-width:1450px;margin:auto}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0}.section-title h2{margin:0;font-size:21px}.section-title button{color:var(--yellow);background:none;border:0}.hero{min-height:340px;border-radius:16px;overflow:hidden;background:linear-gradient(100deg,#20252c,#151a20);display:flex;align-items:end;background-position:center 28%;background-size:cover}.hero-content{padding:28px;background:linear-gradient(0deg,#080a0cf5,transparent);width:100%}.hero h1{font-size:clamp(27px,4vw,43px);margin:0 0 8px}.hero p{color:#d7dce0}.cols{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(290px,.85fr);gap:24px}.panel{background:var(--panel);border:1px solid #252a30;border-radius:14px;padding:18px}.poster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:14px}.poster-card{background:var(--panel);border-radius:12px;overflow:hidden;border:1px solid #262b30}.poster-card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#30343b}.poster-card .body{padding:10px}.poster-card h3{font-size:14px;margin:0 0 7px;min-height:34px}.poster-card button{font-size:12px}.bar{height:7px;background:#363d43;border-radius:8px;overflow:hidden;margin:9px 0}.bar span{display:block;height:100%;background:var(--yellow);border-radius:8px}.muted{color:var(--muted);font-size:13px}.episode-row{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:12px 0}.episode-row:last-child{border:0}.date-chip{min-width:60px;background:#2a3037;border-radius:9px;padding:10px;text-align:center;font-weight:800}.episode-row .info{flex:1;min-width:0}.episode-row strong{display:block}.episode-row small{color:var(--muted)}.episode-row button{flex-shrink:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#252a30;border-radius:12px;padding:15px}.stat b{font-size:26px;display:block;color:var(--yellow)}.stat span{font-size:12px;color:var(--muted)}.hidden{display:none!important}.empty{padding:25px;text-align:center;color:var(--muted)}.pill{border-radius:999px;background:#31383f;padding:5px 10px;font-size:12px}.season-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.season-tabs button.selected{background:var(--yellow);color:#111}.detail-head{display:flex;gap:20px;align-items:start}.detail-head img{width:135px;border-radius:12px}.toast{position:fixed;bottom:22px;right:20px;background:#26332e;color:white;padding:14px 20px;border-radius:10px;z-index:20;box-shadow:0 6px 30px #0009}.bottomnav{display:none}.loading{opacity:.65}.calendar-list{max-height:700px;overflow:auto}input[type=checkbox]{accent-color:var(--yellow);width:19px;height:19px;cursor:pointer}.search-results{position:absolute;top:70px;left:25px;right:25px;max-width:550px;background:#20252b;border:1px solid #42484e;border-radius:12px;max-height:60vh;overflow:auto;box-shadow:0 15px 40px #000a}.search-item{display:flex;align-items:center;gap:12px;padding:10px;border-bottom:1px solid #363c42}.search-item img{width:42px;height:62px;object-fit:cover;border-radius:5px}.search-item .info{flex:1}.search-item strong{display:block}.search-item small{color:var(--muted)}@media(max-width:1000px){.cols{grid-template-columns:1fr}}@media(max-width:700px){.shell{display:block}.sidebar{display:none}.top{padding:12px}.wrap{padding:15px 14px 90px}.hero{min-height:255px}.hero-content{padding:20px}.poster-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.poster-card .body{padding:8px}.poster-card h3{font-size:12px}.stats{gap:6px}.stat{padding:10px}.stat b{font-size:19px}.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#151a1ff5;display:flex;justify-content:space-around;border-top:1px solid #333;z-index:10;padding:10px 3px max(12px,env(safe-area-inset-bottom))}.bottomnav button{background:none;border:0;color:#aab0b6;font-size:11px}.bottomnav button.active{color:var(--yellow)}.detail-head img{width:90px}.episode-row{gap:8px}.date-chip{min-width:48px}.search-results{left:12px;right:12px;top:64px}}
</style></head>
<body><div class="shell"><aside class="sidebar"><div class="brand"><span>▶</span> CINÉFOLIO</div><nav class="nav" id="nav"></nav><small>Suivi personnel · TMDB</small></aside><main class="main"><header class="top"><strong class="mobilebrand">▶</strong><input id="query" type="search" placeholder="Rechercher une série, un film…" autocomplete="off"><button class="primary" id="searchBtn">Rechercher</button><div id="searchResults" class="search-results hidden"></div></header><div class="wrap"><div id="content"></div></div></main></div><nav class="bottomnav" id="bottomnav"></nav><div id="toast" class="toast hidden" role="status"></div>
<script>
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const poster=p=>p?'https://image.tmdb.org/t/p/w342'+p:'';
const backdrop=p=>p?'https://image.tmdb.org/t/p/w1280'+p:'';
const fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('fr-CA',{day:'numeric',month:'short',year:'numeric'}):'Date inconnue';
const state={featured:null,tab:'home',library:[],dashboard:null,selected:null,season:1,detail:null,watched:new Set(),results:[],busy:false};
const tabs=[['home','⌂','Accueil'],['tv','▣','Séries'],['movie','▤','Films'],['calendar','▦','Calendrier'],['progress','◷','Progression']];
async function api(path,opts){const r=await fetch(path,opts);if(!r.ok){let msg='Erreur '+r.status;try{const j=await r.json();msg=j.detail||msg}catch{}throw Error(msg)}return r.json()}
const json=(method,body)=>({method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
function toast(t){const el=$('#toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.add('hidden'),3500)}
function nav(){const html=tabs.map(([id,icon,label])=>'<button class="'+(state.tab===id?'active':'')+'" data-tab="'+id+'">'+icon+' &nbsp;'+label+'</button>').join('');$('#nav').innerHTML=html;$('#bottomnav').innerHTML=html;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab))}
function switchTab(tab){state.tab=tab;state.selected=null;nav();render();window.scrollTo({top:0,behavior:'smooth'})}
async function refresh(){try{state.library=await api('/api/library');render()}catch(e){toast(e.message);render()}}
async function dashboard(){try{state.dashboard=await api('/api/dashboard?days=30');render()}catch(e){toast(e.message);render()}}
function progressFor(id){return state.dashboard?.progress?.find(x=>x.tmdb_id===id)}
function progressBar(p){if(!p||p.error)return '';const percent=p.aired?Math.round(p.watched/p.aired*100):0;return '<div class="bar"><span style="width:'+percent+'%"></span></div><small class="muted">'+p.watched+' / '+p.aired+' épisodes vus · '+percent+' %</small>'}
function card(x){const p=progressFor(x.tmdb_id);return '<article class="poster-card">'+(x.poster?'<img loading="lazy" src="'+poster(x.poster)+'" alt="">':'<div style="height:180px;background:#30363d"></div>')+'<div class="body"><h3>'+esc(x.title)+'</h3>'+(x.kind==='tv'?progressBar(p):'<small class="muted">'+(x.watched?'✓ Vu':'À voir')+'</small>')+'<p><button class="ghost" data-open="'+x.kind+':'+x.tmdb_id+'">'+(x.kind==='tv'?'Épisodes':'Détails')+'</button></p></div></article>'}
function section(title,content,action=''){return '<div class="section-title"><h2>'+title+'</h2>'+action+'</div>'+content}
function episodeRow(e,check=true){return '<div class="episode-row"><div class="date-chip">'+esc(e.air_date?.slice(8,10)||'—')+'<br><small>'+esc(e.air_date?.slice(5,7)||'')+'</small></div><div class="info"><strong>'+esc(e.series||'')+'</strong><small>S'+String(e.season).padStart(2,'0')+'E'+String(e.episode).padStart(2,'0')+' · '+esc(e.title||'')+' · '+fmt(e.air_date)+'</small></div>'+(check?'<button class="ghost" data-mark="'+e.tmdb_id+':'+e.season+':'+e.episode+'">✓ Vu</button>':'<span class="pill">À venir</span>')+'</div>'}
function home(){const d=state.dashboard;const tv=state.library.filter(x=>x.kind==='tv');const next=d?.available?.[0];const featured=tv[0];const hero=featured?'<div class="hero" style="background-image:linear-gradient(0deg,#090b0ded,#090b0d30),url('+(state.featured?.backdrop_path?backdrop(state.featured.backdrop_path):poster(featured.poster))+')"><div class="hero-content"><span class="pill">Reprendre le visionnage</span><h1>'+esc(featured.title)+'</h1><p>'+esc(progressFor(featured.tmdb_id)?.next_unwatched?.title||'Retrouvez vos épisodes')+'</p><button class="primary" data-open="tv:'+featured.tmdb_id+'">Voir les épisodes →</button></div></div>':'<div class="hero"><div class="hero-content"><h1>Bienvenue sur Cinéfolio</h1><p>Ajoutez votre première série ou votre premier film avec la recherche.</p></div></div>';
return '<div class="cols"><div>'+hero+section('Reprendre le visionnage',tv.length?'<div class="poster-grid">'+tv.slice(0,8).map(card).join('')+'</div>':'<p class="empty">Aucune série suivie.</p>','<button data-tab="tv">Tout voir →</button>')+section('Épisodes disponibles',d?.available?.length?'<div class="panel">'+d.available.slice(0,8).map(e=>episodeRow(e)).join('')+'</div>':'<div class="panel empty">Aucun épisode en attente.</div>','<button data-tab="calendar">Calendrier →</button>')+'</div><div>'+section('Épisodes à venir', '<div class="panel">'+(d?.upcoming?.length?d.upcoming.slice(0,8).map(e=>episodeRow(e,false)).join(''):'<p class="empty">Aucune sortie annoncée sur 30 jours.</p>')+'</div>')+section('Statistiques',stats())+'</div></div>'}
function stats(){const p=state.dashboard?.progress||[];const seen=p.reduce((n,x)=>n+(x.watched||0),0);const aired=p.reduce((n,x)=>n+(x.aired||0),0);return '<div class="panel"><div class="stats"><div class="stat"><b>'+seen+'</b><span>Épisodes vus</span></div><div class="stat"><b>'+state.library.filter(x=>x.kind==='tv').length+'</b><span>Séries suivies</span></div><div class="stat"><b>'+(aired?Math.round(seen/aired*100):0)+'%</b><span>Progression</span></div></div><p class="muted">Progression basée sur les épisodes diffusés.</p></div>'}
function collection(kind){const a=state.library.filter(x=>x.kind===kind);return section(kind==='tv'?'Mes séries':'Mes films','<div class="poster-grid">'+(a.length?a.map(card).join(''):'<p class="empty">Aucun titre. Utilisez la recherche pour commencer.</p>')+'</div>')}
function calendar(){const d=state.dashboard;return section('Calendrier des sorties','<p class="muted">Dates de diffusion originale selon TMDB. La disponibilité au Canada dépend de la plateforme.</p><div class="cols"><div class="panel calendar-list"><h3>Prochaines diffusions · 30 jours</h3>'+(d?.upcoming?.length?d.upcoming.map(e=>episodeRow(e,false)).join(''):'<p class="empty">Aucune date annoncée.</p>')+'</div><div class="panel calendar-list"><h3>Diffusés et non vus</h3>'+(d?.available?.length?d.available.map(e=>episodeRow(e)).join(''):'<p class="empty">Tout est à jour.</p>')+'</div></div>','<button id="refreshDashboard">↻ Actualiser</button>')}
function progressPage(){const p=state.dashboard?.progress||[];return section('Progression de visionnage',stats()+'<div class="panel">'+(p.length?p.map(x=>'<div class="episode-row"><div class="info"><strong>'+esc(x.series)+'</strong>'+progressBar(x)+(x.next_unwatched?'<small class="muted">Prochain : S'+x.next_unwatched.season+'E'+x.next_unwatched.episode+' — '+esc(x.next_unwatched.title)+'</small>':'')+'</div><button class="ghost" data-open="tv:'+x.tmdb_id+'">Suivre</button></div>').join(''):'<p class="empty">Ajoutez des séries pour suivre votre progression.</p>')+'</div>')}
function render(){nav();if(state.selected){renderDetail();return}$('#content').innerHTML=state.tab==='home'?home():state.tab==='tv'?collection('tv'):state.tab==='movie'?collection('movie'):state.tab==='calendar'?calendar():progressPage();bind()}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openItem(...b.dataset.open.split(':')));document.querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>mark(...b.dataset.mark.split(':'),true));const r=$('#refreshDashboard');if(r)r.onclick=dashboard}
async function openItem(kind,id){state.selected={kind,id:Number(id)};state.detail=null;$('#content').innerHTML='<p class="empty">Chargement…</p>';try{if(kind==='tv'){state.detail=await api('/api/tv/'+id);state.watched=new Set((state.detail.watched_episodes||[]).map(e=>e.season+':'+e.episode));state.season=state.detail.seasons?.find(s=>s.season_number>0)?.season_number||1;await loadSeason()}else{state.detail=state.library.find(x=>x.kind==='movie'&&x.tmdb_id===Number(id))}renderDetail()}catch(e){toast(e.message);state.selected=null;render()}}
async function loadSeason(){state.episodes=(await api('/api/tv/'+state.selected.id+'/season/'+state.season)).episodes||[]}
async function chooseSeason(n){state.season=Number(n);$('#episodeList').innerHTML='<p class="muted">Chargement…</p>';try{await loadSeason();renderDetail()}catch(e){toast(e.message)}}
function renderDetail(){const x=state.detail;if(!x)return;const id=state.selected.id;const isTv=state.selected.kind==='tv';const seasons=isTv?x.seasons.filter(s=>s.season_number>0):[];const epList=isTv?(state.episodes||[]).map(e=>{const key=state.season+':'+e.episode_number;const seen=state.watched.has(key);return '<div class="episode-row"><input type="checkbox" aria-label="Marquer épisode '+e.episode_number+' comme vu" data-episode="'+e.episode_number+'" '+(seen?'checked':'')+'><div class="info"><strong>'+esc(e.episode_number+'. '+(e.name||'Épisode'))+'</strong><small>'+fmt(e.air_date)+(e.runtime?' · '+e.runtime+' min':'')+'</small></div><span class="pill">'+(seen?'Vu':'À voir')+'</span></div>'}).join(''):'';const count=(state.episodes||[]).length;const watched=(state.episodes||[]).filter(e=>state.watched.has(state.season+':'+e.episode_number)).length;$('#content').innerHTML='<button class="ghost" id="back">← Retour</button><div class="panel" style="margin-top:18px"><div class="detail-head">'+(x.poster_path||x.poster?'<img src="'+poster(x.poster_path||x.poster)+'" alt="">':'')+'<div><h1>'+esc(x.name||x.title)+'</h1><p class="muted">'+esc(x.overview||'')+'</p>'+(isTv?'<strong>'+watched+' / '+count+' épisodes vus dans cette saison</strong>'+progressBar({watched,aired:count}):'<button class="primary" id="movieToggle">'+(x.watched?'✓ Vu':'Marquer comme vu')+'</button>')+'</div></div>'+(isTv?'<div class="season-tabs">'+seasons.map(s=>'<button class="ghost '+(s.season_number===state.season?'selected':'')+'" data-season="'+s.season_number+'">Saison '+s.season_number+'</button>').join('')+'</div><button class="primary" id="allSeen">Marquer la saison comme vue</button><div id="episodeList">'+epList+'</div>':'')+'</div>';
$('#back').onclick=()=>{state.selected=null;render()};document.querySelectorAll('[data-season]').forEach(b=>b.onclick=()=>chooseSeason(b.dataset.season));document.querySelectorAll('[data-episode]').forEach(b=>b.onchange=()=>mark(id,state.season,b.dataset.episode,b.checked,true));const all=$('#allSeen');if(all)all.onclick=markSeason;const mov=$('#movieToggle');if(mov)mov.onclick=async()=>{try{await api('/api/movie/'+id+'/watched',{method:'POST'});await refresh();state.detail=state.library.find(y=>y.kind==='movie'&&y.tmdb_id===id);renderDetail()}catch(e){toast(e.message)}}}
async function mark(id,season,episode,watched,keepDetail=false){try{await api('/api/episode',json('POST',{tmdb_id:Number(id),season:Number(season),episode:Number(episode),watched}));if(keepDetail&&state.selected?.id===Number(id)){const key=season+':'+episode;if(watched)state.watched.add(key);else state.watched.delete(key);renderDetail()}await dashboard();if(keepDetail&&state.selected?.id===Number(id))renderDetail();toast(watched?'Épisode marqué comme vu':'Épisode marqué non vu')}catch(e){toast(e.message)}}
async function markSeason(){const id=state.selected.id;const unseen=state.episodes.filter(e=>!state.watched.has(state.season+':'+e.episode_number));if(!unseen.length)return toast('Saison déjà terminée');if(!confirm('Marquer '+unseen.length+' épisodes comme vus ?'))return;for(const e of unseen){try{await api('/api/episode',json('POST',{tmdb_id:id,season:state.season,episode:e.episode_number,watched:true}));state.watched.add(state.season+':'+e.episode_number)}catch(err){toast(err.message);break}}renderDetail();await dashboard()}
async function search(){const q=$('#query').value.trim();if(q.length<2)return;const el=$('#searchResults');el.classList.remove('hidden');el.innerHTML='<p class="empty">Recherche…</p>';try{state.results=(await api('/api/search?q='+encodeURIComponent(q))).filter(x=>['tv','movie'].includes(x.media_type));el.innerHTML=state.results.length?state.results.slice(0,15).map((x,i)=>'<div class="search-item">'+(x.poster_path?'<img src="'+poster(x.poster_path)+'" alt="">':'')+'<div class="info"><strong>'+esc(x.title||x.name)+'</strong><small>'+esc(x.media_type==='tv'?'Série':'Film')+'</small></div><button class="primary" data-add="'+i+'">+ Ajouter</button></div>').join(''):'<p class="empty">Aucun résultat</p>';document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addHit(Number(b.dataset.add)))}catch(e){el.innerHTML='<p class="empty">'+esc(e.message)+'</p>'}}
async function addHit(i){const x=state.results[i];try{await api('/api/library',json('POST',{kind:x.media_type,tmdb_id:x.id,title:x.title||x.name,poster:x.poster_path}));$('#searchResults').classList.add('hidden');$('#query').value='';await refresh();await dashboard();toast('Ajouté à votre bibliothèque')}catch(e){toast(e.message)}}
$('#searchBtn').onclick=search;$('#query').onkeydown=e=>{if(e.key==='Enter')search();if(e.key==='Escape')$('#searchResults').classList.add('hidden')};document.addEventListener('click',e=>{if(!e.target.closest('.top'))$('#searchResults').classList.add('hidden')});
(async()=>{nav();await refresh();try{state.featured=await api('/api/featured')}catch{}await dashboard()})();
</script></body></html>
