<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0e11"><title>Cinéfolio — Mes séries et films</title>
<style>
:root{color-scheme:dark;--bg:#0b0e11;--panel:#171b20;--card:#20252b;--line:#30363c;--text:#f5f6f7;--muted:#a0a7af;--yellow:#ffcb05;--green:#20c997}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}.sidebar{border-right:1px solid var(--line);padding:26px 15px;position:sticky;top:0;height:100vh}.brand{font-size:23px;font-weight:900;letter-spacing:-.9px;display:flex;align-items:center;gap:10px;margin:0 10px 36px}.brand span{color:var(--yellow)}.nav{display:flex;flex-direction:column;gap:6px}.nav button{width:100%;border:0;background:transparent;color:#c4c8cc;text-align:left;padding:13px 15px;border-radius:10px;font-weight:650}.nav button.active,.nav button:hover{background:var(--yellow);color:#101010}.sidebar small{display:block;color:var(--muted);margin:30px 14px 12px}.main{min-width:0}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:17px 25px;background:#0b0e11ed;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.top input{background:#1d2227;border:1px solid #343b42;color:white;border-radius:12px;padding:13px 16px;flex:1;max-width:500px;outline:none}.top input:focus{border-color:var(--yellow)}.primary{background:var(--yellow);color:#121212;border:0;padding:11px 15px;border-radius:9px;font-weight:800}.ghost{background:#2a3036;color:white;border:0;padding:10px 13px;border-radius:9px}.wrap{padding:26px;max-width:1450px;margin:auto}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0}.section-title h2{margin:0;font-size:21px}.section-title button{color:var(--yellow);background:none;border:0}.hero{min-height:340px;border-radius:16px;overflow:hidden;background:linear-gradient(100deg,#20252c,#151a20);display:flex;align-items:end;background-position:center 28%;background-size:cover}.hero-content{padding:28px;background:linear-gradient(0deg,#080a0cf5,transparent);width:100%}.hero h1{font-size:clamp(27px,4vw,43px);margin:0 0 8px}.hero p{color:#d7dce0}.cols{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(290px,.85fr);gap:24px}.panel{background:var(--panel);border:1px solid #252a30;border-radius:14px;padding:18px}.poster-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:14px}.poster-card{background:var(--panel);border-radius:12px;overflow:hidden;border:1px solid #262b30}.poster-card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#30343b}.poster-card .body{padding:10px}.poster-card.no-poster:before{content:'🎬';display:grid;place-items:center;height:185px;background:linear-gradient(135deg,#303943,#171c22);font-size:40px}.poster-card h3{font-size:14px;margin:0 0 7px;min-height:34px}.poster-card button{font-size:12px}.bar{height:7px;background:#363d43;border-radius:8px;overflow:hidden;margin:9px 0}.bar span{display:block;height:100%;background:var(--yellow);border-radius:8px}.muted{color:var(--muted);font-size:13px}.episode-row{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);padding:12px 0}.episode-row:last-child{border:0}.date-chip{min-width:60px;background:#2a3037;border-radius:9px;padding:10px;text-align:center;font-weight:800}.episode-row .info{flex:1;min-width:0}.episode-row strong{display:block}.episode-row small{color:var(--muted)}.episode-row button{flex-shrink:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#252a30;border-radius:12px;padding:15px}.stat b{font-size:26px;display:block;color:var(--yellow)}.stat span{font-size:12px;color:var(--muted)}.hidden{display:none!important}.empty{padding:25px;text-align:center;color:var(--muted)}.pill{border-radius:999px;background:#31383f;padding:5px 10px;font-size:12px}.season-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.season-tabs button.selected{background:var(--yellow);color:#111}.detail-head{display:flex;gap:20px;align-items:start}.detail-head img{width:135px;border-radius:12px}.toast{position:fixed;bottom:22px;right:20px;background:#26332e;color:white;padding:14px 20px;border-radius:10px;z-index:20;box-shadow:0 6px 30px #0009}.bottomnav{display:none}.loading{opacity:.65}.calendar-list{max-height:700px;overflow:auto}input[type=checkbox]{accent-color:var(--yellow);width:19px;height:19px;cursor:pointer}.search-results{position:absolute;top:70px;left:25px;right:25px;max-width:550px;background:#20252b;border:1px solid #42484e;border-radius:12px;max-height:60vh;overflow:auto;box-shadow:0 15px 40px #000a}.search-item{display:flex;align-items:center;gap:12px;padding:10px;border-bottom:1px solid #363c42}.search-item img{width:42px;height:62px;object-fit:cover;border-radius:5px}.search-item .info{flex:1}.search-item strong{display:block}.search-item small{color:var(--muted)}@media(max-width:1000px){.cols{grid-template-columns:1fr}}@media(max-width:700px){.shell{display:block}.sidebar{display:none}.top{padding:12px}.wrap{padding:15px 14px 90px}.hero{min-height:255px}.hero-content{padding:20px}.poster-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.poster-card .body{padding:8px}.poster-card h3{font-size:12px}.stats{gap:6px}.stat{padding:10px}.stat b{font-size:19px}.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#151a1ff5;display:flex;justify-content:space-around;border-top:1px solid #333;z-index:10;padding:10px 3px max(12px,env(safe-area-inset-bottom))}.bottomnav button{background:none;border:0;color:#aab0b6;font-size:11px}.bottomnav button.active{color:var(--yellow)}.detail-head img{width:90px}.episode-row{gap:8px}.date-chip{min-width:48px}.search-results{left:12px;right:12px;top:64px}}
 .auth-screen{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 15%,#32301c,#0b0e11 65%)}.auth-card{background:#191e23;border:1px solid #363c40;border-radius:20px;padding:32px;width:min(440px,100%);box-shadow:0 25px 80px #0009}.auth-card h1{margin:0 0 8px}.auth-card p{color:#aab0b6}.auth-card label{display:block;margin:14px 0 6px}.auth-card input{width:100%;background:#252b31;color:white;border:1px solid #40474d;padding:13px;border-radius:9px}.auth-card .primary{width:100%;margin-top:20px}.profile-panel{max-width:560px}.profile-panel input{width:100%;padding:12px;border:1px solid #41474e;border-radius:9px;background:#252b31;color:white;margin:8px 0 15px} .provider-list{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}.provider{display:flex;align-items:center;gap:8px;background:#252b31;border-radius:9px;padding:8px 11px}.provider img{width:32px;height:32px;border-radius:6px}.providers-box{margin-top:20px;padding:18px;border:1px solid #394048;border-radius:12px}.providers-box h4{margin:14px 0 8px}.confirm-overlay{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:10000;padding:20px;backdrop-filter:blur(5px)}.confirm-dialog{width:min(420px,100%);padding:28px;border:1px solid #454a50;border-radius:18px;background:#1b2026;box-shadow:0 24px 80px #0009}.confirm-dialog h3{font-size:21px;margin:0 0 12px}.confirm-dialog p{color:#b9c0c7;line-height:1.55}.confirm-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:24px}.confirm-actions button{padding:11px 17px;border-radius:9px}.confirm-dialog button:focus-visible{outline:3px solid #ffcb05;outline-offset:3px}.progress-dashboard{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.progress-kpi{background:#1a2026;border:1px solid #343b43;border-radius:15px;padding:20px}.progress-kpi .number{font-size:30px;font-weight:850;color:#ffcb05;line-height:1.25}.progress-kpi .hint{color:#a7b0b9;font-size:13px;margin-top:7px}.progress-charts{display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,2fr);gap:18px;margin-bottom:22px}.progress-visual{background:#171c22;border:1px solid #343b43;border-radius:16px;padding:23px}.progress-visual h3{margin:0 0 20px}.progress-donut{width:190px;height:190px;border-radius:50%;display:grid;place-items:center;margin:8px auto 20px}.progress-donut-inner{width:143px;height:143px;background:#171c22;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}.progress-donut-inner strong{font-size:38px}.progress-donut-inner small{color:#aeb5bd}.progress-legend{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;color:#aeb5bd;font-size:13px}.progress-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.series-chart-row{display:grid;grid-template-columns:minmax(80px,145px) minmax(0,1fr) 55px;align-items:center;gap:12px;margin:12px 0;font-size:13px}.series-chart-track{height:13px;border-radius:12px;background:#343b43;overflow:hidden}.series-chart-fill{height:100%;border-radius:12px;background:linear-gradient(90deg,#e7a800,#ffcb05)}.series-chart-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.series-chart-pct{text-align:right;color:#ffcb05;font-weight:700}@media(max-width:900px){.progress-dashboard{grid-template-columns:repeat(2,minmax(0,1fr))}.progress-charts{grid-template-columns:1fr}}@media(max-width:480px){.progress-kpi{padding:14px}.progress-kpi .number{font-size:25px}.series-chart-row{grid-template-columns:95px minmax(0,1fr) 43px;gap:7px}}.view-calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:15px}.view-day{min-height:62px;background:#252b31;border:1px solid #343c43;border-radius:9px;padding:7px;text-align:left;color:#d7dce1;font-size:12px}.view-day.active{background:#554811;border-color:#b28c08}.view-day strong{display:block;color:#ffcb05;font-size:17px}.view-day.empty{opacity:.3}.calendar-header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.calendar-header button{padding:8px 12px}.calendar-weekdays{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;color:#a0a7af;font-size:12px;margin-top:14px}.history-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0}.history-stat{background:#252b31;border-radius:12px;padding:15px}.history-stat strong{display:block;color:#ffcb05;font-size:23px}.history-stat small{color:#aeb5bd}@media(max-width:560px){.view-day{min-height:48px;padding:4px;font-size:10px}.view-day strong{font-size:14px}.history-stats{grid-template-columns:1fr}}</style></head>
<body><div id="authRoot"></div><div class="shell hidden" id="appShell"><aside class="sidebar"><div class="brand"><span>▶</span> CINÉFOLIO</div><nav class="nav" id="nav"></nav><small>Suivi personnel · TMDB</small></aside><main class="main"><header class="top"><strong class="mobilebrand">▶</strong><input id="query" type="search" placeholder="Rechercher une série, un film…" autocomplete="off"><button class="primary" id="searchBtn">Rechercher</button><div id="searchResults" class="search-results hidden"></div></header><div class="wrap"><div id="content"></div></div></main></div><nav class="bottomnav" id="bottomnav"></nav><div id="toast" class="toast hidden" role="status"></div>
<script>
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const poster=p=>p?(p.startsWith('http')?p:'https://image.tmdb.org/t/p/w342'+p):'';
const backdrop=p=>p?(p.startsWith('http')?p:'https://image.tmdb.org/t/p/w1280'+p):'';
const fmt=d=>d?new Date(d+'T12:00:00').toLocaleDateString('fr-CA',{day:'numeric',month:'short',year:'numeric'}):'Date inconnue';
const state={featured:null,tab:'home',library:[],dashboard:null,selected:null,season:1,detail:null,watched:new Set(),results:[],busy:false};
const tabs=[['home','⌂','Accueil'],['tv','▣','Séries'],['movie','▤','Films'],['calendar','▦','Calendrier'],['progress','◷','Progression'],['profile','♙','Profil']];
async function api(path,opts){const r=await fetch(path,opts);if(!r.ok){let msg='Erreur '+r.status;try{const j=await r.json();msg=j.detail||msg}catch{}throw Error(msg)}return r.json()}
const json=(method,body)=>({method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
function toast(t){const el=$('#toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.add('hidden'),3500)}
function nav(){const html=tabs.map(([id,icon,label])=>'<button class="'+(state.tab===id?'active':'')+'" data-tab="'+id+'">'+icon+' &nbsp;'+label+'</button>').join('');$('#nav').innerHTML=html;$('#bottomnav').innerHTML=html;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab))}
function switchTab(tab){state.tab=tab;state.selected=null;nav();render();window.scrollTo({top:0,behavior:'smooth'})}
async function refresh(){try{state.library=await api('/api/library');render()}catch(e){toast(e.message);render()}}
async function dashboard(){try{state.dashboard=await api('/api/dashboard?days=30');try{state.viewingHistory=await api('/api/viewing-history')}catch(e){console.warn('Historique indisponible',e)}render()}catch(e){toast(e.message);render()}}
function viewingPercent(watched,total){if(!total)return 0;const ratio=Math.max(0,Math.min(1,watched/total));return watched<total?Math.min(99,Math.round(ratio*100)):100}
function progressFor(id){return state.dashboard?.progress?.find(x=>x.tmdb_id===id)}
function progressBar(p){if(!p||p.error)return '';const percent=p.aired?viewingPercent(p.watched,p.aired):0;return '<div class="bar"><span style="width:'+percent+'%"></span></div><small class="muted">'+p.watched+' / '+p.aired+' épisodes vus · '+percent+' %</small>'}
function card(x){const p=progressFor(x.tmdb_id);return '<article class="poster-card">'+(x.poster?'<img loading="lazy" src="'+poster(x.poster)+'" alt="" onerror="this.onerror=null;this.style.display=\'none\';this.parentElement.classList.add(\'no-poster\')">':'<div style="height:180px;background:#30363d"></div>')+'<div class="body"><h3>'+esc(x.title)+'</h3>'+(x.kind==='tv'?progressBar(p):'<small class="muted">'+(x.watched?'✓ Vu':'À voir')+'</small>')+'<p><button class="ghost" data-open="'+x.kind+':'+x.tmdb_id+'">'+(x.kind==='tv'?'Épisodes':'Détails')+'</button> <button class="ghost" style="color:#ff8f8f" data-remove="'+x.kind+':'+x.tmdb_id+'">Retirer</button></p></div></article>'}
function section(title,content,action=''){return '<div class="section-title"><h2>'+title+'</h2>'+action+'</div>'+content}
function episodeRow(e,check=true){return '<div class="episode-row"><div class="date-chip">'+esc(e.air_date?.slice(8,10)||'—')+'<br><small>'+esc(e.air_date?.slice(5,7)||'')+'</small></div><div class="info"><strong>'+esc(e.series||'')+'</strong><small>S'+String(e.season).padStart(2,'0')+'E'+String(e.episode).padStart(2,'0')+' · '+esc(e.title||'')+' · '+fmt(e.air_date)+'</small></div>'+(check?'<button class="ghost" data-mark="'+e.tmdb_id+':'+e.season+':'+e.episode+'">✓ Vu</button>':'<span class="pill">À venir</span>')+'</div>'}
function home(){const d=state.dashboard;const tv=state.library.filter(x=>x.kind==='tv');const next=d?.available?.[0];const featured=tv[0];const hero=featured?'<div class="hero" style="background-image:linear-gradient(0deg,#090b0ded,#090b0d30),url('+(state.featured?.backdrop_path?backdrop(state.featured.backdrop_path):poster(featured.poster))+')"><div class="hero-content"><span class="pill">Reprendre le visionnage</span><h1>'+esc(featured.title)+'</h1><p>'+esc(progressFor(featured.tmdb_id)?.next_unwatched?.title||'Retrouvez vos épisodes')+'</p><button class="primary" data-open="tv:'+featured.tmdb_id+'">Voir les épisodes →</button></div></div>':'<div class="hero"><div class="hero-content"><h1>Bienvenue sur Cinéfolio</h1><p>Ajoutez votre première série ou votre premier film avec la recherche.</p></div></div>';
return '<div class="cols"><div>'+hero+section('Reprendre le visionnage',tv.length?'<div class="poster-grid">'+tv.slice(0,8).map(card).join('')+'</div>':'<p class="empty">Aucune série suivie.</p>','<button data-tab="tv">Tout voir →</button>')+section('Épisodes disponibles',d?.available?.length?'<div class="panel">'+d.available.slice(0,8).map(e=>episodeRow(e)).join('')+'</div>':'<div class="panel empty">Aucun épisode en attente.</div>','<button data-tab="calendar">Calendrier →</button>')+'</div><div>'+section('Épisodes à venir', '<div class="panel">'+(d?.upcoming?.length?d.upcoming.slice(0,8).map(e=>episodeRow(e,false)).join(''):'<p class="empty">Aucune sortie annoncée sur 30 jours.</p>')+'</div>')+section('Statistiques',stats())+'</div></div>'}
function stats(){const p=state.dashboard?.progress||[];const seen=p.reduce((n,x)=>n+(x.watched||0),0);const aired=p.reduce((n,x)=>n+(x.aired||0),0);return '<div class="panel"><div class="stats"><div class="stat"><b>'+seen+'</b><span>Épisodes vus</span></div><div class="stat"><b>'+state.library.filter(x=>x.kind==='tv').length+'</b><span>Séries suivies</span></div><div class="stat"><b>'+(aired?Math.round(seen/aired*100):0)+'%</b><span>Progression</span></div></div><p class="muted">Progression basée sur les épisodes diffusés.</p></div>'}
function collection(kind){const a=state.library.filter(x=>x.kind===kind);return section(kind==='tv'?'Mes séries':'Mes films','<button class="ghost" id="repairPosters">↻ Récupérer les affiches manquantes</button><div class="poster-grid">'+(a.length?a.map(card).join(''):'<p class="empty">Aucun titre. Utilisez la recherche pour commencer.</p>')+'</div>')}
function calendar(){const d=state.dashboard;return section('Calendrier des sorties','<p class="muted">Dates de diffusion originale selon TMDB. La disponibilité au Canada dépend de la plateforme.</p><div class="cols"><div class="panel calendar-list"><h3>Prochaines diffusions · 30 jours</h3>'+(d?.upcoming?.length?d.upcoming.map(e=>episodeRow(e,false)).join(''):'<p class="empty">Aucune date annoncée.</p>')+'</div><div class="panel calendar-list"><h3>Diffusés et non vus</h3>'+(d?.available?.length?d.available.map(e=>episodeRow(e)).join(''):'<p class="empty">Tout est à jour.</p>')+'</div></div>','<button id="refreshDashboard">↻ Actualiser</button>')}
function viewingStats(){const entries=state.viewingHistory?.episodes||[];const totalMinutes=entries.reduce((s,e)=>s+(e.minutes||0),0);const withRuntime=entries.filter(e=>e.minutes!=null).length;const now=new Date();const month=state.viewMonth||new Date(now.getFullYear(),now.getMonth(),1);const year=month.getFullYear(),m=month.getMonth();const prefix=year+'-'+String(m+1).padStart(2,'0')+'-';const days=new Date(year,m+1,0).getDate();const grouped={};for(const e of entries){const day=(e.watched_at||'').slice(0,10);if(!day)continue;const bucket=grouped[day]||(grouped[day]={count:0,minutes:0,unknown:0});bucket.count++;if(e.minutes!=null)bucket.minutes+=e.minutes;else bucket.unknown++}const monthCount=Object.keys(grouped).filter(d=>d.startsWith(prefix)).reduce((s,d)=>s+grouped[d].count,0);const blanks=(new Date(year,m,1).getDay()+6)%7;const cells=Array.from({length:blanks},()=>'<div></div>').join('')+Array.from({length:days},(_,i)=>{const key=prefix+String(i+1).padStart(2,'0');const d=grouped[key];return '<button class="view-day '+(d?'active':'')+'" data-viewday="'+key+'" title="'+(d?d.count+' épisodes, '+d.minutes+' minutes connues':'Aucun épisode')+'">'+(i+1)+(d?'<strong>'+d.count+' ép.</strong><small>'+Math.floor(d.minutes/60)+' h '+String(d.minutes%60).padStart(2,'0')+'</small>':'')+'</button>'}).join('');const fmtMinutes=n=>Math.floor(n/60)+' h '+String(n%60).padStart(2,'0');return '<div class="progress-visual" style="margin-bottom:20px"><h3>Calendrier de visionnage</h3><div class="history-stats"><div class="history-stat"><strong>'+entries.length+'</strong><small>Épisodes enregistrés</small></div><div class="history-stat"><strong>'+fmtMinutes(totalMinutes)+'</strong><small>Durée totale connue</small></div><div class="history-stat"><strong>'+monthCount+'</strong><small>Épisodes ce mois</small></div></div><div class="calendar-header"><button class="ghost" id="prevViewMonth">←</button><strong>'+month.toLocaleDateString('fr-CA',{month:'long',year:'numeric'})+'</strong><button class="ghost" id="nextViewMonth">→</button></div><div class="calendar-weekdays">'+['L','M','M','J','V','S','D'].map(x=>'<span>'+x+'</span>').join('')+'</div><div class="view-calendar">'+cells+'</div><p class="muted" style="font-size:12px">Les dates correspondent au marquage des épisodes comme vus (UTC), pas nécessairement à leur visionnage réel. Durées selon TMDB : '+withRuntime+' sur '+entries.length+' épisodes renseignés.</p><div id="viewDayDetails" class="muted">Sélectionnez un jour pour consulter les épisodes et leur durée.</div></div>'}
function bindViewingCalendar(){const prev=$('#prevViewMonth'),next=$('#nextViewMonth');if(prev)prev.onclick=()=>{const d=state.viewMonth||new Date();state.viewMonth=new Date(d.getFullYear(),d.getMonth()-1,1);render()};if(next)next.onclick=()=>{const d=state.viewMonth||new Date();state.viewMonth=new Date(d.getFullYear(),d.getMonth()+1,1);render()};document.querySelectorAll('[data-viewday]').forEach(b=>b.onclick=()=>{const key=b.dataset.viewday;const rows=(state.viewingHistory?.episodes||[]).filter(e=>(e.watched_at||'').startsWith(key));const total=rows.reduce((s,e)=>s+(e.minutes||0),0);$('#viewDayDetails').innerHTML='<strong>'+key+' — '+rows.length+' épisode(s) · '+Math.floor(total/60)+' h '+String(total%60).padStart(2,'0')+' de durée connue</strong>'+(rows.length?'<div style="margin-top:8px">'+rows.map(e=>'<p>'+esc(e.title||'Série')+' · S'+e.season+'E'+e.episode+' · '+(e.minutes==null?'Durée inconnue':e.minutes+' min')+'</p>').join('')+'</div>':'<p>Aucun épisode enregistré.</p>')})}
function progressPage(){const all=state.dashboard?.progress||[];const p=all.filter(x=>!x.error);const watched=p.reduce((sum,x)=>sum+(x.watched||0),0);const aired=p.reduce((sum,x)=>sum+(x.aired||0),0);const remaining=Math.max(0,aired-watched);const percent=aired?viewingPercent(watched,aired):0;const complete=p.filter(x=>x.aired>0&&x.watched>=x.aired).length;const kpis=[['Épisodes visionnés',watched,'Tous les épisodes marqués vus'],['Épisodes à voir',remaining,'Épisodes déjà diffusés'],['Séries à jour',complete,'Sur '+p.length+' séries suivies'],['Progression globale',percent+' %','Sur les épisodes diffusés']];const kpiHtml='<div class="progress-dashboard">'+kpis.map(k=>'<div class="progress-kpi"><div class="number">'+k[1]+'</div><div class="hint">'+k[0]+'</div><small class="muted">'+k[2]+'</small></div>').join('')+'</div>';const donut='<div class="progress-visual"><h3>Répartition des épisodes</h3><div class="progress-donut" style="background:conic-gradient(#ffcb05 0% '+percent+'%,#343b43 '+percent+'% 100%)"><div class="progress-donut-inner"><strong>'+percent+' %</strong><small>visionnés</small></div></div><div class="progress-legend"><span><i style="background:#ffcb05"></i>'+watched+' vus</span><span><i style="background:#343b43"></i>'+remaining+' restants</span></div></div>';const ranked=[...p].sort((a,b)=>(b.aired?b.watched/b.aired:0)-(a.aired?a.watched/a.aired:0));const bars='<div class="progress-visual"><h3>Avancement par série</h3>'+(ranked.length?ranked.map(x=>{const pct=x.aired?viewingPercent(x.watched,x.aired):0;return '<div class="series-chart-row"><span class="series-chart-name" title="'+esc(x.series)+'">'+esc(x.series)+'</span><div class="series-chart-track" role="progressbar" aria-label="'+esc(x.series)+'" aria-valuenow="'+pct+'" aria-valuemin="0" aria-valuemax="100"><div class="series-chart-fill" style="width:'+pct+'%"></div></div><span class="series-chart-pct">'+pct+' %</span></div>'}).join(''):'<p class="muted">Ajoutez des séries pour afficher les statistiques.</p>')+'</div>';const errors=all.filter(x=>x.error);return section('Progression de visionnage',kpiHtml+viewingStats()+'<div class="progress-charts">'+donut+bars+'</div><div class="panel"><h3>Suivi détaillé</h3>'+(p.length?p.map(x=>'<div class="episode-row"><div class="info"><strong>'+esc(x.series)+'</strong>'+progressBar(x)+(x.next_unwatched?'<small class="muted">Prochain : S'+x.next_unwatched.season+'E'+x.next_unwatched.episode+' — '+esc(x.next_unwatched.title)+'</small>':'')+'</div><button class="ghost" data-open="tv:'+x.tmdb_id+'">Suivre</button></div>').join(''):'<p class="empty">Ajoutez des séries pour suivre votre progression.</p>')+(errors.length?'<p class="muted">Statistiques indisponibles pour '+errors.length+' série(s) en raison d’une erreur TMDB.</p>':'')+'</div>')}
function render(){nav();if(state.selected){renderDetail();return}$('#content').innerHTML=state.tab==='home'?home():state.tab==='tv'?collection('tv'):state.tab==='movie'?collection('movie'):state.tab==='calendar'?calendar():state.tab==='profile'?profilePage():progressPage();bind()}
function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openItem(...b.dataset.open.split(':')));document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removeItem(...b.dataset.remove.split(':')));document.querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>mark(...b.dataset.mark.split(':'),true));const profileSave=$('#profileSave');if(profileSave)profileSave.onclick=saveProfile;const pwSave=$('#passwordSave');if(pwSave)pwSave.onclick=savePassword;const logout=$('#logoutBtn');if(logout)logout.onclick=signOut;const r=$('#refreshDashboard');if(r)r.onclick=dashboard;const rp=$('#repairPosters');if(rp)rp.onclick=repairPosters;bindViewingCalendar()}
async function openItem(kind,id){state.selected={kind,id:Number(id)};state.detail=null;state.providers=null;$('#content').innerHTML='<p class="empty">Chargement…</p>';try{if(kind==='tv'){state.detail=await api('/api/tv/'+id);state.watched=new Set((state.detail.watched_episodes||[]).map(e=>e.season+':'+e.episode));state.season=state.detail.seasons?.find(s=>s.season_number>0)?.season_number||1;await loadSeason()}else{state.detail=state.library.find(x=>x.kind==='movie'&&x.tmdb_id===Number(id))}renderDetail();loadProviders(kind,id)}catch(e){toast(e.message);state.selected=null;render()}}
async function loadSeason(){state.episodes=(await api('/api/tv/'+state.selected.id+'/season/'+state.season)).episodes||[]}
async function chooseSeason(n){state.season=Number(n);$('#episodeList').innerHTML='<p class="muted">Chargement…</p>';try{await loadSeason();renderDetail()}catch(e){toast(e.message)}}
function providerMarkup(d){if(!d)return '<p class="muted">Chargement des plateformes…</p>';const groups=[['Abonnement','flatrate'],['Gratuit','free'],['Avec publicité','ads'],['Location','rent'],['Achat','buy']];const chunks=groups.filter(g=>(d[g[1]]||[]).length).map(g=>'<h4>'+g[0]+'</h4><div class="provider-list">'+d[g[1]].map(p=>'<div class="provider">'+(p.logo_path?'<img src="https://image.tmdb.org/t/p/w92'+encodeURI(p.logo_path)+'" alt="">':'')+'<span>'+esc(p.provider_name)+'</span><small class="muted">'+esc((p.regions||[]).join(', '))+'</small></div>').join('')+'</div>');const custom=(d.custom||[]).map(p=>'<div class="provider">'+(p.logo_path?'<img src="https://image.tmdb.org/t/p/w92'+encodeURI(p.logo_path)+'" alt="">':'')+'<span>'+esc(p.name)+'</span><button class="ghost" data-custom-remove="'+encodeURIComponent(p.name)+'" aria-label="Retirer cette plateforme">×</button></div>').join('');return (custom?'<h4>Mes plateformes ajoutées</h4><div class="provider-list">'+custom+'</div>':'')+(chunks.length?chunks.join(''):'<p class="muted">Aucune plateforme automatiquement répertoriée.</p>')+'<div style="margin-top:18px"><h4>Ajouter une plateforme manuellement</h4><input id="providerSearch" list="providerOptions" placeholder="Rechercher ou saisir une plateforme" style="padding:10px;width:min(340px,100%);background:#252b31;color:white;border:1px solid #555;border-radius:8px"><datalist id="providerOptions">'+(state.providerCatalog||[]).map(p=>'<option value="'+esc(p.provider_name)+'"></option>').join('')+'</datalist> <button class="primary" id="providerAdd">Ajouter</button></div><small class="muted">Toutes les régions TMDB sont incluses. Une plateforme ajoutée manuellement ne garantit pas la disponibilité du titre.</small>'}
function bindProviderControls(){const add=$('#providerAdd');if(add)add.onclick=async()=>{const name=$('#providerSearch').value.trim();if(!name)return toast('Indiquez une plateforme');const match=(state.providerCatalog||[]).find(p=>p.provider_name.toLowerCase()===name.toLowerCase());try{await api('/api/watch-providers/'+state.selected.kind+'/'+state.selected.id+'/custom',json('POST',{name,provider_id:match?.provider_id||null,logo_path:match?.logo_path||null}));await loadProviders(state.selected.kind,state.selected.id);toast('Plateforme ajoutée')}catch(e){toast(e.message)}};document.querySelectorAll('[data-custom-remove]').forEach(b=>b.onclick=async()=>{try{await api('/api/watch-providers/'+state.selected.kind+'/'+state.selected.id+'/custom/'+b.dataset.customRemove,{method:'DELETE'});await loadProviders(state.selected.kind,state.selected.id)}catch(e){toast(e.message)}})}
async function loadProviders(kind,id){try{const results=await Promise.all([api('/api/watch-providers/'+kind+'/'+id+'?region=ALL'),api('/api/provider-catalog?kind='+kind).catch(()=>[])]);if(state.selected?.kind===kind&&state.selected?.id===Number(id)){state.providers=results[0];state.providerCatalog=results[1];const el=$('#watchProviders');if(el){el.innerHTML=providerMarkup(state.providers);bindProviderControls()}}}catch(e){const el=$('#watchProviders');if(el)el.textContent='Plateformes indisponibles pour le moment.'}}
function renderDetail(){const x=state.detail;if(!x)return;const id=state.selected.id;const isTv=state.selected.kind==='tv';const seasons=isTv?x.seasons.filter(s=>s.season_number>0):[];const epList=isTv?(state.episodes||[]).map(e=>{const key=state.season+':'+e.episode_number;const seen=state.watched.has(key);return '<div class="episode-row"><input type="checkbox" aria-label="Marquer épisode '+e.episode_number+' comme vu" data-episode="'+e.episode_number+'" '+(seen?'checked':'')+'><div class="info"><strong>'+esc(e.episode_number+'. '+(e.name||'Épisode'))+'</strong><small>'+fmt(e.air_date)+(e.runtime?' · '+e.runtime+' min':'')+'</small></div><span class="pill">'+(seen?'Vu':'À voir')+'</span></div>'}).join(''):'';const count=(state.episodes||[]).length;const watched=(state.episodes||[]).filter(e=>state.watched.has(state.season+':'+e.episode_number)).length;$('#content').innerHTML='<button class="ghost" id="back">← Retour</button><div class="panel" style="margin-top:18px"><div class="detail-head">'+(x.poster_path||x.poster?'<img src="'+poster(x.poster_path||x.poster)+'" alt="">':'')+'<div><h1>'+esc(x.name||x.title)+'</h1><p class="muted">'+esc(x.overview||'')+'</p>'+(isTv?'<strong>'+watched+' / '+count+' épisodes vus dans cette saison</strong>'+progressBar({watched,aired:count}):'<button class="primary" id="movieToggle">'+(x.watched?'✓ Vu':'Marquer comme vu')+'</button>')+'</div></div><div class="providers-box"><h3>Où regarder ? 🌍</h3><div id="watchProviders">'+providerMarkup(state.providers)+'</div></div>'+(isTv?'<div class="season-tabs">'+seasons.map(s=>'<button class="ghost '+(s.season_number===state.season?'selected':'')+'" data-season="'+s.season_number+'">Saison '+s.season_number+'</button>').join('')+'</div><button class="primary" id="allSeen">Marquer la saison comme vue</button><div id="episodeList">'+epList+'</div>':'')+'</div>';
$('#back').onclick=()=>{state.selected=null;render()};document.querySelectorAll('[data-season]').forEach(b=>b.onclick=()=>chooseSeason(b.dataset.season));document.querySelectorAll('[data-episode]').forEach(b=>b.onchange=()=>mark(id,state.season,b.dataset.episode,b.checked,true));const all=$('#allSeen');if(all)all.onclick=markSeason;const mov=$('#movieToggle');if(mov)mov.onclick=async()=>{try{await api('/api/movie/'+id+'/watched',{method:'POST'});await refresh();state.detail=state.library.find(y=>y.kind==='movie'&&y.tmdb_id===id);renderDetail()}catch(e){toast(e.message)}}}
async function mark(id,season,episode,watched,keepDetail=false){try{await api('/api/episode',json('POST',{tmdb_id:Number(id),season:Number(season),episode:Number(episode),watched}));if(keepDetail&&state.selected?.id===Number(id)){const key=season+':'+episode;if(watched)state.watched.add(key);else state.watched.delete(key);renderDetail()}await dashboard();if(keepDetail&&state.selected?.id===Number(id))renderDetail();toast(watched?'Épisode marqué comme vu':'Épisode marqué non vu')}catch(e){toast(e.message)}}
function confirmInApp(title,message,confirmLabel='Confirmer'){return new Promise(resolve=>{const overlay=document.createElement('div');overlay.className='confirm-overlay';overlay.setAttribute('role','presentation');overlay.innerHTML='<div class="confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmText"><h3 id="confirmTitle"></h3><p id="confirmText"></p><div class="confirm-actions"><button class="ghost" id="confirmCancel">Annuler</button><button class="primary" id="confirmAccept"></button></div></div>';overlay.querySelector('#confirmTitle').textContent=title;overlay.querySelector('#confirmText').textContent=message;overlay.querySelector('#confirmAccept').textContent=confirmLabel;document.body.appendChild(overlay);const previous=document.activeElement;const finish=value=>{document.removeEventListener('keydown',keyHandler,true);overlay.remove();if(previous?.isConnected)previous.focus();resolve(value)};const keyHandler=e=>{if(e.key==='Escape'){e.preventDefault();finish(false)}else if(e.key==='Tab'){const buttons=[overlay.querySelector('#confirmCancel'),overlay.querySelector('#confirmAccept')];if(e.shiftKey&&document.activeElement===buttons[0]){e.preventDefault();buttons[1].focus()}else if(!e.shiftKey&&document.activeElement===buttons[1]){e.preventDefault();buttons[0].focus()}}};document.addEventListener('keydown',keyHandler,true);overlay.querySelector('#confirmCancel').onclick=()=>finish(false);overlay.querySelector('#confirmAccept').onclick=()=>finish(true);overlay.addEventListener('click',e=>{if(e.target===overlay)finish(false)});overlay.querySelector('#confirmCancel').focus()})}
async function markSeason(){const id=state.selected.id;const unseen=state.episodes.filter(e=>!state.watched.has(state.season+':'+e.episode_number));if(!unseen.length)return toast('Saison déjà terminée');if(!await confirmInApp('Marquer la saison comme vue','Confirmer le visionnage de '+unseen.length+' épisode'+(unseen.length>1?'s':'')+' de cette saison ?','Marquer comme vus'))return;for(const e of unseen){try{await api('/api/episode',json('POST',{tmdb_id:id,season:state.season,episode:e.episode_number,watched:true}));state.watched.add(state.season+':'+e.episode_number)}catch(err){toast(err.message);break}}renderDetail();await dashboard()}
async function search(){const q=$('#query').value.trim();if(q.length<2)return;const el=$('#searchResults');el.classList.remove('hidden');el.innerHTML='<p class="empty">Recherche…</p>';try{state.results=(await api('/api/search?q='+encodeURIComponent(q))).filter(x=>['tv','movie'].includes(x.media_type));el.innerHTML=state.results.length?state.results.slice(0,15).map((x,i)=>'<div class="search-item">'+(x.poster_path?'<img src="'+poster(x.poster_path)+'" alt="">':'')+'<div class="info"><strong>'+esc(x.title||x.name)+'</strong><small>'+esc(x.media_type==='tv'?'Série':'Film')+'</small></div><button class="primary" data-add="'+i+'">+ Ajouter</button></div>').join(''):'<p class="empty">Aucun résultat</p>';document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addHit(Number(b.dataset.add)))}catch(e){el.innerHTML='<p class="empty">'+esc(e.message)+'</p>'}}
async function repairPosters(){try{toast('Recherche des affiches manquantes…');const result=await api('/api/library/refresh-posters',{method:'POST'});await refresh();toast(result.updated+' affiche(s) récupérée(s)')}catch(e){toast(e.message)}}
async function removeItem(kind,id){const item=state.library.find(x=>x.kind===kind&&x.tmdb_id===Number(id));if(!item)return;const message='Retirer « '+item.title+' » de votre bibliothèque ?\\n\\nVotre progression de visionnage sera conservée si vous ajoutez cette série à nouveau.';if(!confirm(message))return;try{await api('/api/library/'+encodeURIComponent(kind)+'/'+Number(id),{method:'DELETE'});if(state.selected?.id===Number(id)&&state.selected?.kind===kind)state.selected=null;await refresh();await dashboard();toast('« '+item.title+' » retiré de la bibliothèque')}catch(e){toast(e.message)}}
async function addHit(i){const x=state.results[i];try{await api('/api/library',json('POST',{kind:x.media_type,tmdb_id:x.id,title:x.title||x.name,poster:x.poster_path}));$('#searchResults').classList.add('hidden');$('#query').value='';await refresh();await dashboard();toast('Ajouté à votre bibliothèque')}catch(e){toast(e.message)}}
function profilePage(){return section('Mon profil','<div class="panel profile-panel"><h3>Informations personnelles</h3><label>Identifiant</label><p class="muted">'+esc(state.user?.username)+'</p><label>Nom affiché</label><input id="profileName" maxlength="80" value="'+esc(state.user?.display_name)+'"><button class="primary" id="profileSave">Enregistrer</button><hr style="border-color:#353a40;margin:30px 0"><h3>Changer le mot de passe</h3><label>Mot de passe actuel</label><input type="password" id="oldPassword" autocomplete="current-password"><label>Nouveau mot de passe (12 caractères minimum)</label><input type="password" id="newPassword" autocomplete="new-password"><button class="primary" id="passwordSave">Changer le mot de passe</button><hr style="border-color:#353a40;margin:30px 0"><button class="ghost" id="logoutBtn">Se déconnecter</button></div>')}
async function saveProfile(){try{await api('/api/auth/profile',json('PATCH',{display_name:$('#profileName').value}));state.user=await api('/api/auth/profile');toast('Profil enregistré')}catch(e){toast(e.message)}}
async function savePassword(){try{await api('/api/auth/password',json('POST',{current_password:$('#oldPassword').value,new_password:$('#newPassword').value}));$('#oldPassword').value='';$('#newPassword').value='';toast('Mot de passe modifié')}catch(e){toast(e.message)}}
async function signOut(){try{await api('/api/auth/logout',{method:'POST'})}catch{}location.reload()}
function showAuth(setup){$('#appShell').classList.add('hidden');$('#bottomnav').classList.add('hidden');$('#authRoot').innerHTML='<div class="auth-screen"><form class="auth-card" id="authForm"><h1 style="color:#ffcb05">▶ CINÉFOLIO</h1><p>'+(setup?'Créer votre compte propriétaire':'Connectez-vous pour retrouver vos séries et votre progression')+'</p><label>Identifiant</label><input id="authUsername" autocomplete="username" required minlength="3" maxlength="40">'+(setup?'<label>Nom affiché</label><input id="authDisplay" required maxlength="80">':'')+'<label>Mot de passe</label><input id="authPassword" type="password" autocomplete="'+(setup?'new-password':'current-password')+'" required minlength="'+(setup?'12':'1')+'"><button class="primary" type="submit">'+(setup?'Créer mon compte':'Se connecter')+'</button><p class="muted" id="authError"></p></form></div>';$('#authForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/auth/'+(setup?'register':'login'),json('POST',{username:$('#authUsername').value,password:$('#authPassword').value,display_name:setup?$('#authDisplay').value:undefined}));location.reload()}catch(err){$('#authError').textContent=err.message}}}
$('#searchBtn').onclick=search;$('#query').onkeydown=e=>{if(e.key==='Enter')search();if(e.key==='Escape')$('#searchResults').classList.add('hidden')};document.addEventListener('click',e=>{if(!e.target.closest('.top'))$('#searchResults').classList.add('hidden')});
(async()=>{try{const status=await api('/api/auth/status');if(!status.authenticated){showAuth(status.setup_required);return}state.user=status.user;$('#appShell').classList.remove('hidden');$('#bottomnav').classList.remove('hidden');$('#authRoot').innerHTML='';nav();await refresh();try{state.featured=await api('/api/featured')}catch{}await dashboard()}catch(e){showAuth(false);$('#authError').textContent=e.message}})();
</script></body></html>
